# Every push to master and every pull request: licensing (REUSE), the site itself, served
# as it is (.github/check/site.mjs: script errors, WCAG 2.2 AA, reflow, the easter eggs, and
# the Konsool pages' keyboard focus), and konsool/badgelink.js against the badge's own
# BadgeLink code (konsool/test/: mock.sh builds it as a host program).
name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@v6

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Serve the site and check it
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1
          node .github/check/site.mjs http://localhost:8000

  badgelink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: BadgeLink client against the badge's code
        run: node --test konsool/test/badgelink.test.js
