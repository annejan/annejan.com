version = 1
SPDX-PackageName = "annejan.com"
SPDX-PackageSupplier = "Anne Jan Brouwer"
SPDX-PackageDownloadLocation = "https://annejan.com/"

# Code: MIT.
[[annotations]]
path = [
    "**.js",
    "**.css",
    ".htaccess",
    ".gitignore",
    "robots.txt",
    "sitemap.xml",
    "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2010-2026 Anne Jan Brouwer"
SPDX-License-Identifier = "MIT"

# Pages, texts, the AJB monogram, the favicon, the share image and Yuki's photo: CC-BY-4.0.
# The inline GitHub, LinkedIn and Mastodon icons in index.html are marked as CC0-1.0 snippets.
[[annotations]]
path = [
    "**.html",
    "humans.txt",
    "ajb.png",
    "ajb.svg",
    "bimi.svg",
    "logo.svg",
    "og.png",
    "apple-touch-icon.png",
    "favicon.ico",
    "CV_Anne_Jan.pdf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2010-2026 Anne Jan Brouwer"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "error/yuki-touw.jpg"
SPDX-FileCopyrightText = "2004 Anne Jan Brouwer"
SPDX-License-Identifier = "CC-BY-4.0"

# Brand icons from Simple Icons (https://simpleicons.org/).
[[annotations]]
path = ["logos/github.svg", "logos/linkedin.svg", "logos/mastodon.svg"]
SPDX-FileCopyrightText = "Simple Icons contributors"
SPDX-License-Identifier = "CC0-1.0"

# The QtPass padlocked heart without its shackle, for the demo (which draws the shackle
# from the logo's geometry).
[[annotations]]
path = ["demo/qtpass-body.svg"]
SPDX-FileCopyrightText = "AnonMoos"
SPDX-License-Identifier = "CC0-1.0"

# Badge.Team's 80s stamp (unchanged), badge drawings (rendered into one sheet, and the
# Konsool on its own, cropped) and hero photo (resized), from
# https://github.com/badgeteam/website, for the demo; and its badger and snake, from
# badge.rs (https://github.com/annejan/badge.rs), for the typed easter eggs.
[[annotations]]
path = ["demo/badgeteam-stamp.svg", "demo/badges.webp", "demo/konsool.webp", "demo/badgeteam-hero.jpg", "fx/badger.webp", "fx/snake.webp"]
SPDX-FileCopyrightText = "Stichting Badge.Team"
SPDX-License-Identifier = "CC-BY-4.0"

# The QtPass padlocked heart, made white and single-colour. Released into the public domain by
# AnonMoos on Wikimedia Commons; CC0-1.0 here, as in QtPass's own REUSE.toml.
[[annotations]]
path = "logos/qtpass.png"
SPDX-FileCopyrightText = "AnonMoos"
SPDX-License-Identifier = "CC0-1.0"

# The "B" from the Badge.Team wordmark, cropped and made white and single-colour.
[[annotations]]
path = "logos/badgeteam.png"
SPDX-FileCopyrightText = "Stichting Badge.Team"
SPDX-License-Identifier = "CC-BY-4.0"

# Logos used only to link to their owners.
[[annotations]]
path = "logos/maindeck.png"
SPDX-FileCopyrightText = "MainDeck"
SPDX-License-Identifier = "LicenseRef-Trademark"

[[annotations]]
path = "logos/aidtoukraine.png"
SPDX-FileCopyrightText = "Aid to Ukraine"
SPDX-License-Identifier = "LicenseRef-Trademark"

# Press Start 2P, used by the C64 screen: the unmodified upstream font file.
[[annotations]]
path = ["fonts/PressStart2P-Regular.ttf", "fonts/OFL.txt"]
SPDX-FileCopyrightText = "2012 The Press Start 2P Project Authors (cody@zone38.net)"
SPDX-License-Identifier = "OFL-1.1"

# The annejan.com remix of "Kloten met de broodtrommel" (X 2026): the release's music,
# synthesised from scratch (x2026-kloten repo, remix/remix.py).
[[annotations]]
path = "music/**"
SPDX-FileCopyrightText = "2026 deFEEST (music arranged and sequenced by Anus, with help from Kloot and Augurk; remix by Anus with Claude)"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"
